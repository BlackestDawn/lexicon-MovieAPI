# Demo/local environment only. It wires the API container up to real instances
# of every external service it talks to (Postgres, Redis, Elasticsearch) with
# throwaway demo credentials - a real deployment supplies its own connection
# strings/secrets via its orchestrator/secret manager instead of this file.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__postgres: "Host=postgres;Port=5432;Database=MovieAPI;Username=movieapi;Password=${POSTGRES_PASSWORD:-P@ssw0rd_Demo1}"
      # OutputCache:Provider and Logging:Sink are fully config-driven (see
      # Program.cs) - set to "Redis"/"Elasticsearch" here so this demo stack
      # keeps exercising those containers/code paths. For a lighter local run
      # with no Redis/Elasticsearch containers at all, switch these to
      # "Memory"/"Console" and drop their depends_on entries below; "Console"
      # also underlies previewing "GoogleCloudLogging"'s output shape locally
      # (it calls the real Cloud Logging API via ADC, so it needs real GCP
      # credentials and isn't practical to run against from this demo stack).
      OutputCache__Provider: "Redis"
      ConnectionStrings__redis: "redis:6379"
      Logging__Sink: "Elasticsearch"
      Elasticsearch__Uri: "http://elasticsearch:9200"
      OpenIddict__AccessTokenLifetimeMinutes: "60"
      OpenIddict__RefreshTokenLifetimeDays: "7"
      # A base64 PKCS#8 DER-encoded RSA private key, not a raw symmetric key - see the
      # comment in Program.cs. Generate your own with:
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0
      OpenIddict__SigningKey: ${OPENIDDICT_SIGNING_KEY:-}
      OpenIddict__EncryptionKey: ${OPENIDDICT_ENCRYPTION_KEY:-vAyd5IU6grxTQ+jkp3yr46/4WvIfesjsIRo2D8m2Gog=}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@movieapi.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin123!}
      # No separate migration step in this demo stack, so let the API apply
      # migrations itself on startup - see Program.cs.
      ApplyMigrationsOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - movieapi-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Read at runtime by src/proxy.ts - points at the api service.
      BACKEND_URL: "http://api:8080"
    depends_on:
      - api
    networks:
      - movieapi-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: movieapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd_Demo1}
      POSTGRES_DB: MovieAPI
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieapi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - movieapi-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movieapi-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      # Demo-only: real deployments should enable xpack security and give the
      # API its own credentials rather than an anonymous/open Elasticsearch.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - movieapi-net

networks:
  movieapi-net:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
