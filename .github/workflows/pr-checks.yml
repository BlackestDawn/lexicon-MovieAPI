name: PR pre-checks

on:
  pull_request:
    branches: [main]

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore MovieAPI.slnx

      - name: Build
        working-directory: backend
        run: dotnet build MovieAPI.slnx --no-restore

      # Covers both MovieAPI.UnitTests and MovieAPI.IntegrationTests. The
      # latter manages its own Postgres Testcontainer end to end (see
      # IntegrationTestWebAppFactory) - Docker is preinstalled on this
      # runner, no separate service container needed.
      - name: Test
        working-directory: backend
        run: dotnet test MovieAPI.slnx --no-build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        # next.config.ts's rewrites() reads BACKEND_URL at build time (see
        # frontend/Dockerfile) - a dummy value is enough to prove the build
        # succeeds, this job doesn't need a real backend to talk to.
        env:
          BACKEND_URL: http://localhost:8080
        run: pnpm run build

  docker-smoke-test:
    runs-on: ubuntu-latest
    # Minimal check that the actual images deploy-staging.yml/deploy-prod.yml
    # ship (not just `dotnet build`/`pnpm run build`) build and boot
    # correctly - backend-build-and-test and frontend-build above already
    # cover real behavior by running the code directly, so this only needs
    # to prove the Docker artifacts come up.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movieapi
          POSTGRES_PASSWORD: smoke-test-password
          POSTGRES_DB: MovieAPI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movieapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t movieapi-backend:smoke .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t movieapi-frontend:smoke .

      - name: Start backend container
        run: |
          docker run -d --name backend-smoke --network host \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__postgres="Host=localhost;Port=5432;Database=MovieAPI;Username=movieapi;Password=smoke-test-password" \
            -e OutputCache__Provider=Memory \
            -e Logging__Sink=Console \
            -e OpenIddict__SigningKey="" \
            -e OpenIddict__EncryptionKey="vAyd5IU6grxTQ+jkp3yr46/4WvIfesjsIRo2D8m2Gog=" \
            -e ApplyMigrationsOnStartup=true \
            movieapi-backend:smoke

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend never became healthy"
          docker logs backend-smoke
          exit 1

      - name: Start frontend container
        run: |
          docker run -d --name frontend-smoke --network host \
            -e BACKEND_URL=http://localhost:8080 \
            movieapi-frontend:smoke

      - name: Wait for frontend to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend never became healthy"
          docker logs frontend-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "--- backend logs ---"
          docker logs backend-smoke || true
          echo "--- frontend logs ---"
          docker logs frontend-smoke || true

      - name: Clean up containers
        if: always()
        run: docker rm -f backend-smoke frontend-smoke || true
